name: DSE Weekly Combined Regime Pipeline

on:
  schedule:
    # 17:30 UTC Friday = 11:30 PM Dhaka time (Asia/Dhaka, UTC+6, no DST).
    - cron: "30 17 * * 5"
  workflow_dispatch: {}  # manual trigger any time from the Actions tab

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run_weekly.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
