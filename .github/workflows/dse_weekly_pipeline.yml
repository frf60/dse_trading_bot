name: DSE Combined v1_45stc + v2_allstc Pipeline

on:
  schedule:
    # 17:30 UTC daily = 11:30 PM Dhaka time (Asia/Dhaka, UTC+6, no DST).
    # Runs every day; if RawStaging/RawDailyPrices has no new trading-day
    # data since the last run, this is a safe no-op (idempotent -- see
    # run_weekly.py's docstring: ingest dedupes on (date,ticker), scan
    # only looks at dates after last_scanned_date, and reruns with
    # nothing new just rewrite the same current views).
    - cron: "30 17 * * *"
  workflow_dispatch: {}  # manual trigger any time from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run_weekly.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
